# Root Logger Configuration
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console Appender Setup
appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ----------------------------------------------------------------------
# Hibernate 6 Logging Configuration
# ----------------------------------------------------------------------

# Log executed SQL queries
logger.hibernate_sql.name = org.hibernate.SQL
logger.hibernate_sql.level = DEBUG

# Log parameter bindings in Hibernate 6 (?, ?, ?)
logger.hibernate_bind.name = org.hibernate.orm.jdbc.bind
logger.hibernate_bind.level = TRACE

# Log schema generation (DDL statements like CREATE TABLE, DROP TABLE)
logger.hibernate_tool.name = org.hibernate.tool.hbm2ddl
logger.hibernate_tool.level = DEBUG

# Mute noisy internal initialization/registry logs
logger.hibernate.name = org.hibernate
logger.hibernate.level = WARN